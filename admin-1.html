<style>
:root{color-scheme:light;--h:#0b2a6f;--sf:#e3ebfa;--ag:linear-gradient(180deg,#fff,#eaf1ff);--p:#fbb017;--p2:#f57c00;--d:#0b2a6f;--g:#2e9a2e;--bg:#f5f9ff;--c:#fff;--t:#1e293b;--m:#64748b;--b:#e2e8f0;--r:16px}
html{background:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--t);padding-bottom:78px;line-height:1.5}
header{position:sticky;top:0;z-index:20;background:var(--c);padding:6px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 12px #0b2a6f22;border-bottom:3px solid;border-image:linear-gradient(90deg,var(--p),var(--g)) 1}
header img{height:46px}header b{font-size:16px;color:var(--h);display:block;line-height:1.1}header small{color:var(--m);font-size:11px}
header .lsw{margin-left:auto}
.out{background:var(--d);color:#fff;border:0;border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer}
.lsw{display:flex;background:var(--sf);border-radius:20px;padding:3px;flex:none}.lsw button{border:0;background:none;padding:5px 9px;border-radius:16px;font-size:12px;font-weight:700;color:var(--h);cursor:pointer}.lsw button.on{background:var(--d);color:#fff}
main{max-width:900px;margin:auto;padding:14px}
section{display:none}section.on{display:block}
h2.t{font-size:18px;margin:14px 0 8px;color:var(--h)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:10px 0}
.card{background:var(--c);border-radius:var(--r);padding:14px;box-shadow:0 2px 10px #0000000d;border:1px solid var(--b);margin-bottom:10px}
.stat{text-align:center}.stat b{display:block;font-size:26px;color:var(--h)}.stat span{font-size:12px;color:var(--m)}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;text-decoration:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}.btn.full{width:100%;margin-top:12px}
.btn.red{background:#dc2626}.btn.grn{background:var(--g)}.btn.navy{background:var(--d)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--b);border-radius:10px;font-size:15px;font-family:inherit;background:var(--c);color:var(--t)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p)}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:2}.bar select{flex:1}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-weight:700;font-size:15px}.sm2{font-size:12.5px;color:var(--m)}
.tag{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;background:#fef3c7;color:#92400e;white-space:nowrap}.tag.ok{background:#dcfce7;color:#166534}.tag.bad{background:#fee2e2;color:#991b1b}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}.acts select{width:auto;padding:6px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);display:flex;border-top:1px solid var(--b);z-index:30;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px #0001}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:11px;color:var(--m);cursor:pointer}nav button span{display:block;font-size:20px}nav button.on{color:var(--h);font-weight:700}
#login{position:fixed;inset:0;z-index:100;background:var(--ag);padding:24px 18px;overflow:auto}
#login .box{max-width:400px;margin:0 auto}#login .lg{text-align:center}#login .lg img{height:100px}#login h2{text-align:center;margin:8px 0 2px;color:var(--h)}
.err{color:#b91c1c;font-size:13px;margin-top:10px;min-height:18px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--d);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:200;display:none;max-width:90%}
body.locked header,body.locked main,body.locked nav{display:none}
.empty{text-align:center;color:var(--m);padding:24px;font-size:14px}
.lrow{display:flex;gap:8px}.lrow button{flex:1;border:1.5px solid var(--b);background:var(--c);border-radius:12px;padding:11px 4px;font-weight:700;font-size:14px;color:var(--h);cursor:pointer}.lrow button.on{background:var(--d);color:#fff;border-color:var(--d)}
html[data-theme=dark]{color-scheme:dark;--bg:#0e1522;--c:#172033;--t:#e6ebf5;--m:#9aa8c0;--b:#2a3752;--d:#2f5fd0;--h:#a9c1ff;--sf:#1f2b45;--ag:linear-gradient(180deg,#0e1522,#111c30)}
html[data-theme=dark] header img,html[data-theme=dark] #login .lg img{background:#fff;border-radius:10px;padding:2px 4px}
html[data-theme=dark] .tag{background:#3a2a0a;color:#fcd34d}html[data-theme=dark] .tag.ok{background:#12301f;color:#86efac}html[data-theme=dark] .tag.bad{background:#3b1414;color:#fca5a5}
html[data-theme=dark] .err{color:#f87171}
html[data-theme=dark] .card{box-shadow:0 2px 10px #0006}
</style>
</head>

function applyTheme(){
  let th="light";try{th=localStorage.getItem("ad_theme")||"light"}catch(_){}
  const dk=th==="dark"||(th==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dk?"dark":"light";
  const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content=dk?"#172033":"#ffffff";
  document.querySelectorAll("[data-th]").forEach(b=>b.classList.toggle("on",b.dataset.th===th));
}
window.setTheme=th=>{try{localStorage.setItem("ad_theme",th)}catch(_){}applyTheme()};
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(_){}
function applyLang(){
  applyTheme();
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=t(e.dataset.i)});
  document.querySelectorAll("[data-p]").forEach(e=>{e.placeholder=t(e.dataset.p)});
  document.querySelectorAll(".lsw button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  const cur=$("lf").value;
  $("lf").innerHTML=`<option value="">${t("l_all")}</option>`+ST.map(s=>`<option>${s}</option>`).join("");
  $("lf").value=cur;

}

window.go=id=>{

/* ---------- Login ---------- */
function errMsg(e){
  const c=e&&e.code||"";
  if(c.startsWith("auth/invalid")||c==="auth/wrong-password"||c==="auth/user-not-found")return t("e_bad");
  if(c==="auth/network-request-failed")return t("e_net");
  if(c==="auth/too-many-requests")return t("e_many");
  return t("e_gen")+(c||e.message||e);
}
window.doLogin=async()=>{
  $("lerr").textContent="";
  const e=$("le").value.trim(),p=$("lp").value;
  if(!e||!p){$("lerr").textContent=t("e_fill");return}
  $("lbtn").disabled=true;
  try{await signInWithEmailAndPassword(auth,e,p)}catch(x){$("lerr").textContent=errMsg(x)}
  $("lbtn").disabled=false;
};
window.doLogout=()=>signOut(auth);
const stop=()=>{unsubs.forEach(f=>f());unsubs=[]};

onAuthStateChanged(auth,async user=>{
  stop();loggedIn=false;
  if(!user){document.body.classList.add("locked");$("login").style.display="block";return}
  if((user.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
    $("lerr").textContent=t("e_adm");
    await signOut(auth);return;
  }
  loggedIn=true;
  $("login").style.display="none";document.body.classList.remove("locked");$("lp").value="";
  unsubs.push(onSnapshot(query(collection(db,"leads"),orderBy("createdAt","desc")),s=>{
    leads=s.docs.map(d=>({id:d.id,...d.data()}));renderAll();
  },e=>{console.error(e);toast(t("t_lerr")+(e.code||e.message))}));
  unsubs.push(onSnapshot(collection(db,"users"),s=>{
    users=s.docs.map(d=>({id:d.id,...d.data()}));
    users.sort((a,b)=>(b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0));
    renderAll();
  },e=>{console.error(e);toast(t("t_uerr")+(e.code||e.message))}));
  unsubs.push(onSnapshot(doc(db,"config","app"),s=>{
    if(cfgLoaded)return;cfgLoaded=true;
    const c=s.data()||{};
    ["phone","address","banner","heroHi","heroMr","heroEn"].forEach(k=>$("s_"+k).value=c[k]||"");
    $("s_markup").value=(typeof c.markup==="number")?c.markup:5000;
  },()=>{}));
});

/* ---------- Render ---------- */
function renderAll(){renderStats();renderRecent();renderLeads();renderUsers()}
function renderStats(){
  const c=s=>leads.filter(x=>x.status===s).length;
  const items=[[t("st_users"),users.length],[t("st_blocked"),users.filter(u=>u.blocked===true).length],[t("st_leads"),leads.length],[t("st_new"),c("New")],[t("st_inst"),c("Installed")],[t("st_sub"),c("Subsidy Received")]];
  $("stats").innerHTML=items.map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("");
}
const tagCls=s=>(s==="Installed"||s==="Subsidy Received")?"ok":s==="Lost"?"bad":"";
function leadCard(x,full){
  const d=x.createdAt?.toDate?.();
  const wa="https://wa.me/91"+String(x.phone||"").replace(/\D/g,"").slice(-10);
  return `<div class="card"><div class="row"><div><div class="nm">${esc(x.name)}</div><div class="sm2">📞 <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a> · ${esc(x.location)}${x.state?", "+esc(x.state):""}</div></div><span class="tag ${tagCls(x.status)}">${esc(x.status)}</span></div>
  <div class="sm2" style="margin-top:6px">⚡ ${esc(x.kw)} kW · ₹${esc(x.bill||0)}${t("c_per")} · ${esc(x.type)}${x.consumerNo?" · "+t("c_cons")+esc(x.consumerNo):""}</div>
  ${x.note?`<div class="sm2">📝 ${esc(x.note)}</div>`:""}
  <div class="sm2">🕒 ${fmt(d)} · ✉ ${esc(x.email)}</div>
  ${full?`<div class="acts"><select onchange="setSt('${x.id}',this.value)">${ST.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select><a class="btn sm grn" href="tel:${esc(x.phone)}">${t("c_call")}</a><a class="btn sm" href="${wa}" target="_blank">${t("c_wa")}</a><button class="btn sm red" onclick="delLead('${x.id}')">${t("c_del")}</button></div>`:""}</div>`;
}
function renderRecent(){
  $("recent").innerHTML=leads.length?leads.slice(0,5).map(x=>leadCard(x,false)).join(""):`<div class="empty">${t("l_empty")}</div>`;
}
window.renderLeads=()=>{
  const q=$("lq").value.trim().toLowerCase(),f=$("lf").value;
  const a=leads.filter(x=>(!f||x.status===f)&&(!q||[x.name,x.phone,x.location,x.email].join(" ").toLowerCase().includes(q)));
  $("leadList").innerHTML=a.length?a.map(x=>leadCard(x,true)).join(""):`<div class="empty">${t("l_none")}</div>`;
};
window.renderUsers=()=>{
  const q=$("uq").value.trim().toLowerCase();
  const a=users.filter(u=>!q||[u.name,u.phone,u.email].join(" ").toLowerCase().includes(q));
  $("userList").innerHTML=a.length?a.map(u=>{
    const n=leads.filter(l=>l.uid===u.id).length,b=u.blocked===true;
    return `<div class="card"><div class="row"><div><div class="nm">${esc(u.name||t("u_noname"))}</div><div class="sm2">📞 ${u.phone?`<a href="tel:${esc(u.phone)}">${esc(u.phone)}</a>`:"—"}<br>✉ ${esc(u.email)}<br>🕒 ${fmt(u.createdAt?.toDate?.())} · ${t("u_cnt")}${n}</div></div><span class="tag ${b?"bad":"ok"}">${b?t("u_off"):t("u_on")}</span></div>
    <div class="acts"><button class="btn sm ${b?"grn":"red"}" onclick="blk('${u.id}',${b})">${b?t("u_unb"):t("u_blk")}</button></div></div>`;
  }).join(""):`<div class="empty">${t("u_none")}</div>`;
};

/* ---------- Actions ---------- */
window.setSt=async(id,s)=>{try{await updateDoc(doc(db,"leads",id),{status:s});toast(t("t_st")+s)}catch(e){toast("❌ "+(e.code||e.message))}};
window.delLead=async id=>{if(!confirm(t("t_delq")))return;try{await deleteDoc(doc(db,"leads",id));toast(t("t_del"))}catch(e){toast("❌ "+(e.code||e.message))}};
window.blk=async(id,isBlocked)=>{
  if(!confirm(isBlocked?t("t_unq"):t("t_blkq")))return;
  try{await updateDoc(doc(db,"users",id),{blocked:!isBlocked});toast(isBlocked?t("t_unb"):t("t_blk"))}catch(e){toast("❌ "+(e.code||e.message))}
};
window.saveCfg=async()=>{
  const data={};
  ["phone","address","banner","heroHi","heroMr","heroEn"].forEach(k=>data[k]=$("s_"+k).value.trim());
  data.phone=data.phone.replace(/\D/g,"");
  data.markup=Math.max(0,Math.round(Number($("s_markup").value)||0));
  try{await setDoc(doc(db,"config","app"),data,{merge:true});toast(t("t_saved"))}catch(e){toast("❌ "+(e.code||e.message))}
};
function dl(name,rows){
  const csv="﻿"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click();
}
window.csvLeads=()=>{if(!leads.length)return toast(t("t_nodata"));
  dl("leads.csv",[["Date","Name","Mobile","Email","Location","State","kW","Bill","Type","ConsumerNo","Status","Note"],...leads.map(x=>[fmt(x.createdAt?.toDate?.()),x.name,x.phone,x.email,x.location,x.state,x.kw,x.bill,x.type,x.consumerNo,x.status,x.note])])};
window.csvUsers=()=>{if(!users.length)return toast(t("t_nodata"));
  dl("users.csv",[["Joined","Name","Mobile","Email","Blocked"],...users.map(u=>[fmt(u.createdAt?.toDate?.()),u.name,u.phone,u.email,u.blocked?"Yes":"No"])])};

applyLang();
</script>
</body>
</html>
